# Source manifest
#
# Rules:
#   1. only sources with a clear license; `license` is required;
#   2. downloaded HTML goes to corpus/raw/ (gitignored); cleaned text to corpus/processed/;
#   3. record a sha256/version so corpus changes are traceable;
#   4. `verified: false` means the link/license has not been checked by a human yet.

version: 2
updated: "2026-11-15"

sources:
  - key: nimh
    title: NIMH — Stress, Depression, Anxiety, Trauma
    url: https://www.nimh.nih.gov/health/
    lang: en
    license: Public Domain (US Government work)
    usage: free to use; attribution appreciated
    verified: true
    priority: 1
    covers: [stress, depression, anxiety, trauma, coping]

  - key: medlineplus
    title: MedlinePlus — Depression, Anxiety, Stress, Mental Health, Occupational Health
    url: https://medlineplus.gov/
    lang: en
    license: Public Domain (US Government work)
    usage: free to use
    verified: true
    priority: 1
    covers: [depression, anxiety, stress, mental health, workplace]

  - key: samhsa
    title: SAMHSA — Mental Health, National Helpline, 988
    url: https://www.samhsa.gov/
    lang: en
    license: Public Domain (US Government work)
    usage: free to use
    verified: true
    priority: 1
    covers: [mental health, crisis, helpline, workplace]

  - key: osha
    title: OSHA — Workplace Stress
    url: https://www.osha.gov/workplace-stress
    lang: en
    license: Public Domain (US Government work)
    usage: free to use
    verified: true
    priority: 1
    covers: [workplace stress, employer duties]

  - key: who
    title: WHO — Mental health at work, Depression, Anxiety
    url: https://www.who.int/news-room/fact-sheets
    lang: en
    license: CC BY-NC-SA 3.0 IGO
    usage: non-commercial, attribution, share-alike
    verified: true
    priority: 2
    covers: [workplace mental health, depression, anxiety]

# Excluded
excluded:
  - real company EAP handbooks (privacy/authorization)
  - commercial test manuals (MMPI, WAIS, MBTI)
  - unredacted counseling records
  - news/self-media mental-health content without review
